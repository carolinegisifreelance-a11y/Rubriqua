# Mise en ligne du site sur l'hébergement IONOS, par SSH.
# Lancement manuel depuis l'onglet Actions de GitHub (bouton Run workflow), en choisissant l'action :
#   apercu   : envoie le site dans /public/refonte-site et l'affiche sur rubriqua.com
#              aux seuls navigateurs qui ont le cookie d'aperçu (adresse /refonte-site/apercu.php).
#              Les visiteurs continuent de voir WordPress.
#   basculer : garde une copie du .htaccess de WordPress, puis installe le site à la racine (/public).
#              Tout le monde voit le nouveau site. Les fichiers WordPress restent en place, inactifs.
#   retour   : remet le .htaccess de WordPress et retire la page d'accueil du nouveau site.
#              WordPress redevient visible.
#   reinitialiser-2fa : désactive la double authentification du tableau de bord (téléphone perdu ou changé).
#              À la connexion suivante, un nouveau QR code s'affiche pour l'associer à la nouvelle application.
# Réglages (Settings, Secrets and variables, Actions) :
#   SSH_HOST, SSH_USER, SSH_PASS : compte SFTP et SSH créé dans IONOS
#   MAIL_TO, SMTP_USER, SMTP_PASS : boîte contact@rubriqua.com
#   DASHBOARD_PASSWORD : mot de passe du tableau de bord (12 caractères minimum)
#   DB_HOST, DB_NAME, DB_USER, DB_PASS : facultatifs. Sans eux, le site utilise SQLite dans donnees/

name: Mise en ligne

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        type: choice
        options: [apercu, basculer, retour, reinitialiser-2fa]
        default: apercu

concurrency: mise-en-ligne

env:
  SSHPASS: ${{ secrets.SSH_PASS }}
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: sudo apt-get install -y -qq sshpass rsync > /dev/null

      - name: Forcer le rechargement des styles et scripts
        # Ajoute un numéro de version aux fichiers CSS et JS, pour que les navigateurs ne gardent pas une ancienne version en cache
        run: |
          V=${GITHUB_SHA::8}
          find . -name '*.html' -not -path './maquettes/*' -not -path './.git/*' -exec sed -i -E "s#(href=\"[^\"]*\.css)\"#\1?v=$V\"#g; s#(src=\"[^\"]*js/[^\"]*\.js)\"#\1?v=$V\"#g" {} +
          grep -o 'style.css?v=[a-z0-9]*' index.html

      - name: Préparer le fichier de configuration
        if: inputs.action == 'apercu' || inputs.action == 'basculer'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          php -r '
            $e = fn($k) => var_export((string)getenv($k), true);
            $dsn = getenv("DB_HOST") ? "mysql:host=" . getenv("DB_HOST") . ";dbname=" . getenv("DB_NAME") . ";charset=utf8mb4" : "";
            $hash = getenv("DASHBOARD_PASSWORD") ? password_hash(getenv("DASHBOARD_PASSWORD"), PASSWORD_DEFAULT) : "";
            $c = "<?php\nif (!defined(\"RUBRIQUA\")) { http_response_code(404); exit; }\nreturn [\n"
               . "  \"db_dsn\" => " . var_export($dsn, true) . ",\n"
               . "  \"db_user\" => " . $e("DB_USER") . ",\n"
               . "  \"db_pass\" => " . $e("DB_PASS") . ",\n"
               . "  \"mail_to\" => " . $e("MAIL_TO") . ",\n"
               . "  \"mail_from\" => " . $e("SMTP_USER") . ",\n"
               . "  \"smtp_user\" => " . $e("SMTP_USER") . ",\n"
               . "  \"smtp_pass\" => " . $e("SMTP_PASS") . ",\n"
               . "  \"dashboard_hash\" => " . var_export($hash, true) . ",\n"
               . "];\n";
            file_put_contents("api/config.php", $c);
          '

      - name: Aperçu privé
        if: inputs.action == 'apercu'
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST"
          DIR=public/refonte-site
          $SSH "mkdir -p $DIR"
          if $SSH "test -f $DIR/.site-rubriqua"; then DELETE="--delete"; else DELETE=""; fi
          touch .site-rubriqua
          rsync -rlz $DELETE -e "sshpass -e ssh -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' --exclude '.github/' --exclude 'docs/' --exclude 'maquettes/' \
            --exclude 'README.md' --exclude '.gitignore' --exclude 'donnees/*.sqlite*' \
            ./ "$SSH_USER@$SSH_HOST:$DIR/"
          # Copie de sécurité du .htaccess de WordPress, faite une seule fois
          $SSH "test -f public/.htaccess.avant-refonte || cp public/.htaccess public/.htaccess.avant-refonte"
          # Ajout des lignes d'aperçu en tête du .htaccess, si elles n'y sont pas déjà
          $SSH 'cd public && grep -q "BEGIN Rubriqua apercu" .htaccess || { printf "%s\n" \
            "# BEGIN Rubriqua apercu" \
            "<IfModule mod_rewrite.c>" \
            "RewriteEngine On" \
            "RewriteCond %{HTTP_COOKIE} (^|;\\s*)rb_apercu=1" \
            "RewriteCond %{REQUEST_URI} !^/refonte-site/" \
            "RewriteRule ^(.*)\$ /refonte-site/\$1 [L]" \
            "</IfModule>" \
            "# END Rubriqua apercu" "" > .htaccess.nouveau && cat .htaccess >> .htaccess.nouveau && mv .htaccess.nouveau .htaccess; }'
          $SSH "head -9 public/.htaccess"

      - name: Basculer
        if: inputs.action == 'basculer'
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST"
          $SSH "test -f public/.htaccess.avant-refonte || cp public/.htaccess public/.htaccess.avant-refonte"
          # Ajout seulement : rien n'est supprimé à la racine, WordPress reste en place et peut revenir
          rsync -rlz -e "sshpass -e ssh -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' --exclude '.github/' --exclude 'docs/' --exclude 'maquettes/' \
            --exclude 'README.md' --exclude '.gitignore' --exclude 'donnees/*.sqlite*' \
            ./ "$SSH_USER@$SSH_HOST:public/"
          # Reprise des données de l'aperçu (messages, visites), puis suppression du dossier d'aperçu
          $SSH "mkdir -p public/donnees && if [ -f public/refonte-site/donnees/rubriqua.sqlite ] && [ ! -f public/donnees/rubriqua.sqlite ]; then cp public/refonte-site/donnees/rubriqua.sqlite public/donnees/; fi"
          $SSH "test -f public/refonte-site/.site-rubriqua && rm -rf public/refonte-site || true"
          # Anciens dossiers remplacés par une redirection
          $SSH "rm -rf public/category"
          $SSH "head -3 public/.htaccess; ls public/donnees"

      - name: Réinitialiser la double authentification
        if: inputs.action == 'reinitialiser-2fa'
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST"
          $SSH "mkdir -p public/donnees && touch public/donnees/.reinitialiser-2fa && ls -a public/donnees"

      - name: Retour à WordPress
        if: inputs.action == 'retour'
        run: |
          SSH="sshpass -e ssh -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST"
          $SSH "test -f public/.htaccess.avant-refonte && cp public/.htaccess.avant-refonte public/.htaccess && rm -f public/index.html"

      - name: Nettoyage
        if: always()
        run: rm -f api/config.php

      - name: Vérifications
        if: inputs.action == 'apercu' || inputs.action == 'basculer'
        run: |
          COOKIE=""
          if [ "${{ inputs.action }}" = "apercu" ]; then COOKIE="rb_apercu=1"; fi
          check() { printf "%-34s %s\n" "$1" "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -A 'Mozilla/5.0 Verification' "https://rubriqua.com$1")"; }
          for p in / /agence-seo-startup/ /glossaire/ /seogeo/ /blog/ /comment-faire-un-audit-seo/ /contact/ /pilotage-rb7k2q/ /sitemap.xml /robots.txt /api/lib.php /api/config.php /donnees/ /page-qui-n-existe-pas/ /refonte-site/ /category/seo/ /categorie/seo/ /how-to-run-a-technical-seo-audit-on-your-site/ /xmlrpc.php; do check "$p"; done
          echo "Titre avec le site : $(curl -s -b "$COOKIE" https://rubriqua.com/ | grep -o '<title>[^<]*' )"
          echo "Titre sans cookie   : $(curl -s https://rubriqua.com/ | grep -o '<title>[^<]*' )"
          echo "Mesure d'audience   : $(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE" -X POST -H 'Origin: https://rubriqua.com' -A 'Mozilla/5.0 Verification' --data '{"p":"/","r":"","w":1400}' https://rubriqua.com/api/hit.php)"
          echo "État technique      : $(curl -s -b "$COOKIE" https://rubriqua.com/api/etat.php)"
          echo "Formulaire (champ piège) : $(curl -s -b "$COOKIE" -H 'Accept: application/json' -H 'Origin: https://rubriqua.com' --data 'nom=Robot&email=robot@exemple.fr&societe_web=x' https://rubriqua.com/api/contact.php)"
